name: Electron Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # libsecret is required to compile keytar native bindings on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build (compile TS + Vite)
        run: npm run build

      # Linux build (AppImage + deb) — no signing required.
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows build (nsis). Signing is opt-in via CSC_LINK / CSC_KEY_PASSWORD.
      # When secrets are absent, electron-builder still produces an unsigned installer
      # which triggers SmartScreen on first launch — see app/CI-SIGNING.md.
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # E2E Playwright suite (F18). Runs against the packaged binary produced
      # by the earlier electron-builder step (--linux / --win both emit an
      # unpacked tree under release/{linux,win}-unpacked/ as a side effect).
      # This catches asar / native-bindings / CSP regressions that vitest
      # cannot. xvfb is required on Linux because the GH-hosted ubuntu
      # runners are headless; Windows runners ship a display server.
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
        working-directory: ${{ github.workspace }}

      - name: Run E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e
        env:
          CI: '1'

      - name: Run E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: byan-${{ matrix.os }}-${{ github.run_number }}
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest*.yml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-${{ github.run_number }}
          path: |
            app/playwright-report/**
            app/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/*.exe
            release-artifacts/**/latest*.yml
            release-artifacts/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
