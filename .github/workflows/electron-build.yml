name: Electron Build

# Tag dedie desktop-v* : les tags v* du depot portent les versions npm de
# create-byan-agent (2.x) — les reutiliser declencherait une release Desktop a
# chaque publication npm, avec des numeros qui ne correspondent pas a l'app.
on:
  push:
    branches: [main]
    tags: ['desktop-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: ./app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # libsecret is required to compile keytar native bindings on Linux.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev
        working-directory: ${{ github.workspace }}

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build (compile TS + Vite)
        run: npm run build

      # Linux build (AppImage + deb) — no signing required.
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Windows build (nsis). Signing is opt-in via CSC_LINK / CSC_KEY_PASSWORD.
      # When secrets are absent, electron-builder still produces an unsigned installer
      # which triggers SmartScreen on first launch — see app/CI-SIGNING.md.
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Mac build (zip, x64 + arm64). Signing is opt-in via CSC_LINK /
      # CSC_KEY_PASSWORD (Developer ID Application cert exported as .p12).
      # Notarization is opt-in via APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD /
      # APPLE_TEAM_ID. Without these secrets the app ships unsigned — users
      # will see a Gatekeeper warning on first launch (right-click → Open
      # bypasses it). See app/CI-SIGNING.md.
      # continue-on-error : the mac dmg tooling is fragile on the hosted runner
      # ("app not a file") and mac is a bonus — its failure must NEVER block the
      # Linux AppImage / Windows exe from reaching the release.
      - name: Package macOS
        if: runner.os == 'macOS'
        continue-on-error: true
        run: npx electron-builder --mac --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # E2E Playwright suite (F18). Runs against the packaged binary produced
      # by the earlier electron-builder step (--linux / --win both emit an
      # unpacked tree under release/{linux,win}-unpacked/ as a side effect).
      # This catches asar / native-bindings / CSP regressions that vitest
      # cannot. xvfb is required on Linux because the GH-hosted ubuntu
      # runners are headless; Windows runners ship a display server.
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y xvfb
        working-directory: ${{ github.workspace }}

      # E2E is ADVISORY (continue-on-error), NOT a release gate. The gate is
      # unit tests (npm test) + typecheck + lint above, which DO block. The
      # Playwright suite launches the real packaged binary headless and is
      # timing-fragile on hosted runners (30s launch timeouts, xvfb) — letting
      # it fail the job would block the downloadable installers for an infra
      # flake, not a real app defect. The report is still uploaded below.
      - name: Run E2E (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npm run test:e2e
        env:
          CI: '1'

      - name: Run E2E (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Run E2E (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: npm run test:e2e
        env:
          CI: '1'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byan-${{ matrix.os }}-${{ github.run_number }}
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.exe
            app/release/*.dmg
            app/release/*.zip
            app/release/*.blockmap
            app/release/latest*.yml
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}-${{ github.run_number }}
          path: |
            app/playwright-report/**
            app/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  # Publie la GitHub Release avec les installateurs en pieces jointes
  # TELECHARGEABLES d'un clic (AppImage, deb, exe, zip mac). C'est LE canal de
  # telechargement, pas la page Packages : GitHub Packages n'heberge que des
  # registres (npm/conteneurs), jamais un fichier brut cliquable. Les Releases,
  # si — https://github.com/Yan-Acadenice/BYAN/releases.
  #
  # if: always() -> la release part meme si une jambe de la matrice a echoue
  # (mac fragile) : on publie ce qui a REELLEMENT construit. draft: false +
  # prerelease -> immediatement telechargeable, zero clic manuel.
  release:
    name: Publish GitHub Release (downloadable installers)
    needs: build
    if: ${{ always() && startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ONLY the installer artifacts (byan-<os>-<run>), NOT the
      # playwright-report-* uploads — otherwise the Playwright report and trace
      # .zip files (hash-named) leak into the release as junk assets.
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: byan-*
          merge-multiple: true
          path: release-artifacts/

      - name: Publish release with installer assets
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # prerelease: false + make_latest -> la release porte le badge "Latest"
          # et /releases/latest la renvoie. Une prerelease est EXCLUE de "latest"
          # (page depot vide, /releases/latest en 404) : c'est ce qui donnait
          # "j'ai pas l'AppImage sur GitHub" alors qu'elle etait publiee.
          prerelease: false
          make_latest: 'true'
          generate_release_notes: true
          fail_on_unmatched_files: false
          # Named globs only — the mac app zip is BYAN-<version>-<arch>.zip, so
          # BYAN-*.zip stays specific and never re-scoops arbitrary .zip noise.
          files: |
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.deb
            release-artifacts/**/BYAN-Setup-*.exe
            release-artifacts/**/BYAN-Setup-*.exe.blockmap
            release-artifacts/**/*.dmg
            release-artifacts/**/BYAN-*.zip
            release-artifacts/**/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
