# Miroir du paquet npm sur GitHub Packages (registre npm de GitHub), pour que
# create-byan-agent apparaisse sur https://github.com/Yan-Acadenice/BYAN/packages.
# Le registre GitHub exige un nom cadre par le proprietaire : le paquet y est
# publie sous @yan-acadenice/create-byan-agent. npmjs.org reste le canal
# principal d'installation (npx create-byan-agent) — ceci est un miroir.
#
# Declencheurs : un tag v* (la version npm que tu viens de publier), ou un
# lancement manuel depuis l'onglet Actions (workflow_dispatch).
name: npm mirror (GitHub Packages)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish-ghp:
    name: Publish @yan-acadenice/create-byan-agent
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (registre GitHub)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Scope the package name for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            p.name = '@yan-acadenice/create-byan-agent';
            p.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
            console.log('nom publie :', p.name, p.version);
          "

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
