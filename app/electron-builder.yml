appId: fr.acadenice.byan
productName: BYAN
copyright: Copyright (c) 2026 Yan Acadenice

directories:
  output: release/
  buildResources: build/

files:
  - dist/**/*
  - package.json
  - "!**/__tests__/**"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!**/*.map"
  - "!playwright.config.*"
  - "!tsconfig.e2e.json"
  - "!playwright-report/**"
  - "!test-results/**"

asar: true
asarUnpack:
  - node_modules/keytar/**/*
  # ws en fichiers reels : le serveur webui est forke en Node pur (pas d'acces
  # a l'asar), il resout ws via NODE_PATH -> app.asar.unpacked/node_modules.
  - node_modules/ws/**/*

extraResources:
  # Le serveur webui est expedie EN CONSERVANT la structure du depot
  # (install/src/webui + src/byan-v2/lib) : ses require() relatifs
  # (../../../src/byan-v2/lib/layout-resolver depuis api.js, ../../../../
  # depuis chat/*) resolvent alors a l'identique une fois empaquete.
  # L'ancien aplatissement "webui-server/" cassait ces chemins au lancement.
  - from: ../install/src/webui
    to: install/src/webui
    filter:
      - "**/*"
      - "!node_modules"
  - from: ../src/byan-v2/lib
    to: src/byan-v2/lib
    filter:
      - "**/*"
  # Onboarding installers (claude, copilot, codex) walk these templates to
  # build FileWritePlan[]; without them the wizard returns 0 plans and auto-
  # jumps to Done. resolveTemplateRoot() reads process.resourcesPath/templates.
  - from: ../install/templates
    to: templates
    filter:
      - "**/*"
      - "!**/node_modules/**"

publish:
  provider: github
  owner: Yan-Acadenice
  repo: BYAN

# F17: register byan:// protocol with the OS at install time. The runtime
# `app.setAsDefaultProtocolClient('byan')` only patches the current session;
# this entry persists the association across reboots and installs the right
# Info.plist (Mac), Registry keys (Win), and .desktop MimeType (Linux).
protocols:
  - name: BYAN deep link
    schemes:
      - byan

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Executable en minuscules, explicite : le deb installe /opt/BYAN/byan et lie
  # /usr/bin/byan — les chemins exacts que la detection du CLI (desktop-app.js)
  # sonde. Cle posee cote linux uniquement : Windows garde BYAN.exe, macOS
  # garde BYAN.app.
  executableName: byan
  category: Development
  icon: build/icons/
  desktop:
    StartupWMClass: BYAN
    Categories: Development;IDE
  maintainer: Yan Acadenice <yan@acadenice.fr>

deb:
  depends:
    - libsecret-1-0
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils

appImage:
  category: Development

win:
  target:
    - target: nsis
      arch: x64
  icon: build/icons/icon.ico
  publisherName: Yan Acadenice
  artifactName: BYAN-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: BYAN
  uninstallDisplayName: BYAN
  deleteAppDataOnUninstall: false

# Mac targets — F21. Universal DMG covers Intel + Apple Silicon in a single
# installer. ZIP target is required by electron-updater on macOS (the differential
# delta format ships as a .zip alongside the .dmg).
#
# Code signing: hardenedRuntime + entitlements are pre-wired so a future
# Developer ID Application certificate can be plugged in by setting
# CSC_LINK / CSC_KEY_PASSWORD env vars at build time. Without a cert the app
# ships unsigned; users will need to right-click → Open the first time.
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  # PNG source : electron-builder convertit png -> icns au build (icon.icns
  # n'existe pas dans le depot ; referencer un fichier absent casse la chaine mac).
  icon: build/icons/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  artifactName: BYAN-${version}-${arch}.${ext}

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380
